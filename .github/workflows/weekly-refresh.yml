name: Weekly real-data snapshot

on:
  schedule:
    # Tuesday: the Labelbox export lands on Arbutus on Monday evening UTC.
    # Friday as well, so the embedding cache is read well inside GitHub's
    # seven-day eviction window and a late upload is picked up within the week.
    - cron: '17 4 * * 2,5'
  workflow_dispatch:
    inputs:
      refresh_labels:
        description: Download the latest Labelbox export from Arbutus. Disable only to rebuild the explicitly dated cached inputs.
        type: boolean
        default: true
      hand_out:
        description: Batches to hand to the collaborator, pinned from the lowest unpinned number so they keep their frames. Scheduled runs hand out none.
        type: number
        default: 0
      deploy:
        description: Deploy the verified public site after building. Disable for a validation-only run.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-real-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'traitlab/bci-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Require an authenticated real input bundle
        env:
          BCI_INPUT_BUNDLE_URL: ${{ vars.BCI_INPUT_BUNDLE_URL }}
          BCI_INPUT_BUNDLE_SHA256: ${{ vars.BCI_INPUT_BUNDLE_SHA256 }}
          BCI_INPUT_BUNDLE_KEY: ${{ secrets.BCI_INPUT_BUNDLE_KEY }}
          ARBUTUS_S3_ENDPOINT: ${{ vars.ARBUTUS_S3_ENDPOINT }}
          ARBUTUS_S3_ACCESS_KEY: ${{ secrets.ARBUTUS_S3_ACCESS_KEY }}
          ARBUTUS_S3_SECRET_KEY: ${{ secrets.ARBUTUS_S3_SECRET_KEY }}
          BCI_LABELBOX_EXPORTS: ${{ vars.BCI_LABELBOX_EXPORTS }}
          BCI_LABELBOX_PROJECTS: ${{ vars.BCI_LABELBOX_PROJECTS }}
          FETCH_LABELS: ${{ github.event_name == 'schedule' || inputs.refresh_labels }}
        run: |
          python - <<'PY'
          import os, re
          required = ['BCI_INPUT_BUNDLE_URL', 'BCI_INPUT_BUNDLE_SHA256', 'BCI_INPUT_BUNDLE_KEY', 'ARBUTUS_S3_ENDPOINT', 'ARBUTUS_S3_ACCESS_KEY', 'ARBUTUS_S3_SECRET_KEY']
          if os.environ['FETCH_LABELS'] == 'true':
              required += ['BCI_LABELBOX_EXPORTS', 'BCI_LABELBOX_PROJECTS']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Refresh is not configured. Missing: ' + ', '.join(missing) + '. The live snapshot is retained.')
          if not os.environ['BCI_INPUT_BUNDLE_URL'].startswith('https://'):
              raise SystemExit('BCI_INPUT_BUNDLE_URL must use HTTPS.')
          if not os.environ['ARBUTUS_S3_ENDPOINT'].startswith('https://'):
              raise SystemExit('ARBUTUS_S3_ENDPOINT must use HTTPS.')
          if not re.fullmatch(r'[a-fA-F0-9]{64}', os.environ['BCI_INPUT_BUNDLE_SHA256']):
              raise SystemExit('BCI_INPUT_BUNDLE_SHA256 must be the encrypted bundle SHA-256.')
          PY
      - name: Install the fetch client and pinned assessment libraries
        # crownfirst requires Python 3.13. Its compatible labelfirst[parquet]
        # dependency is pinned to 3721bdab143b2c8bd58a1ebabebd2d57b0d5b3ff.
        # Both repos are private: a read-only token covering them lets pip clone.
        env:
          TRAITLAB_READ_TOKEN: ${{ secrets.TRAITLAB_READ_TOKEN }}
        run: |
          if [ -z "$TRAITLAB_READ_TOKEN" ]; then
            echo '::error::TRAITLAB_READ_TOKEN is not set; pip cannot clone private traitlab/crownfirst and traitlab/labelfirst. The live snapshot is retained.'
            exit 1
          fi
          git config --global url."https://x-access-token:${TRAITLAB_READ_TOKEN}@github.com/traitlab/".insteadOf "https://github.com/traitlab/"
          python -m pip install -r requirements-predict.txt \
            'crownfirst @ git+https://github.com/traitlab/crownfirst.git@48dec6b91e762902bac9fe245494c5bda61fe45e'
      - name: Download, verify, decrypt, and validate the private baseline
        env:
          BCI_INPUT_BUNDLE_URL: ${{ vars.BCI_INPUT_BUNDLE_URL }}
          BCI_INPUT_BUNDLE_SHA256: ${{ vars.BCI_INPUT_BUNDLE_SHA256 }}
          BCI_INPUT_BUNDLE_KEY: ${{ secrets.BCI_INPUT_BUNDLE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/bci-private"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            --retry 3 --max-time 300 "$BCI_INPUT_BUNDLE_URL" --output "$RUNNER_TEMP/bci-private/inputs.tar.gz.gpg"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'bci-private/inputs.tar.gz.gpg'
          if hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != os.environ['BCI_INPUT_BUNDLE_SHA256'].lower():
              raise SystemExit('Encrypted baseline checksum mismatch; live snapshot retained.')
          PY
          printf '%s' "$BCI_INPUT_BUNDLE_KEY" | gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --output "$RUNNER_TEMP/bci-private/inputs.tar.gz" \
            --decrypt "$RUNNER_TEMP/bci-private/inputs.tar.gz.gpg"
          python -S bin/refresh_snapshot.py unpack --archive "$RUNNER_TEMP/bci-private/inputs.tar.gz" \
            --destination "$RUNNER_TEMP/bci-private/baseline"
          cp -a "$RUNNER_TEMP/bci-private/baseline/data/." data/
      - name: Fetch fresh labels separately from the offline build
        if: github.event_name == 'schedule' || inputs.refresh_labels
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARBUTUS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARBUTUS_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          ARBUTUS_S3_ENDPOINT: ${{ vars.ARBUTUS_S3_ENDPOINT }}
          BCI_LABELBOX_EXPORTS: ${{ vars.BCI_LABELBOX_EXPORTS }}
          BCI_LABELBOX_PROJECTS: ${{ vars.BCI_LABELBOX_PROJECTS }}
        run: |
          umask 077
          exports="$RUNNER_TEMP/bci-private/exports"
          mkdir -p "$exports"
          i=0
          newest=''
          for path in $BCI_LABELBOX_EXPORTS; do
            i=$((i + 1))
            name=$(basename "$path")
            aws --endpoint-url "$ARBUTUS_S3_ENDPOINT" s3 cp "s3://$path" "$(printf '%s/%02d_%s.ndjson' "$exports" "$i" "${name%.*}")"
            modified=$(aws --endpoint-url "$ARBUTUS_S3_ENDPOINT" s3api head-object --bucket "${path%%/*}" --key "${path#*/}" --query LastModified --output text)
            modified=$(date -u -d "$modified" +%F)
            if [[ "$modified" > "$newest" ]]; then newest="$modified"; fi
          done
          printf '%s\n' "$newest" > "$exports/export_date.txt"
          # A scheduled run on an old export means the weekly upload stopped.
          # Failing sends the repo's failure email; the live site is retained.
          age=$(( ($(date -u +%s) - $(date -u -d "$newest" +%s)) / 86400 ))
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$age" -gt 6 ]; then
            echo "::error::The newest Labelbox export on Arbutus is from $newest, $age days old. The weekly upload has not arrived. The live snapshot is retained."
            exit 1
          fi
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          projects = set(os.environ['BCI_LABELBOX_PROJECTS'].split())
          if not projects or any(not re.fullmatch(r'[A-Za-z0-9_-]+', project) for project in projects):
              raise SystemExit('BCI_LABELBOX_PROJECTS must contain space-separated project IDs.')
          files = sorted((Path(os.environ['RUNNER_TEMP']) / 'bci-private/exports').glob('*.ndjson'))
          if not files:
              raise SystemExit('No exports were downloaded; refusing to publish.')
          for path in files:
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              if not rows:
                  raise SystemExit(f'{path.name} is empty; refusing to publish.')
              for row in rows:
                  data_row = row.get('data_row') or {}
                  if not data_row.get('id') or not data_row.get('global_key'):
                      raise SystemExit(f'{path.name} has a row without data_row id and global_key; refusing to publish.')
                  if not isinstance(row.get('projects'), dict) or not set(row['projects']) <= projects:
                      raise SystemExit(f'{path.name} has a row outside BCI_LABELBOX_PROJECTS; refusing to publish.')
          PY
      - name: Restore the per-photo vectors of the labelled frames
        # The bundle carries the stacked npz, not the cache it came from. Restoring
        # the newest cache means a weekly run embeds only the frames named since.
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/embeddings-labelled.tar.gz.gpg
          key: embeddings-labelled-enc-${{ github.run_id }}
          restore-keys: embeddings-labelled-enc-
      - name: Decrypt the per-photo vectors
        env:
          BCI_INPUT_BUNDLE_KEY: ${{ secrets.BCI_INPUT_BUNDLE_KEY }}
        run: |
          umask 077
          archive="$RUNNER_TEMP/embeddings-labelled.tar.gz.gpg"
          if [ -f "$archive" ]; then
            mkdir -p data/embeddings_labelled
            printf '%s' "$BCI_INPUT_BUNDLE_KEY" | gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --decrypt "$archive" | tar -xz -C data/embeddings_labelled
          fi
      - name: Fetch the previous run's refresh manifest
        # The change log needs the earlier runs' lines and CI keeps no snapshots.
        # No unexpired artifact (first run, or older than its retention) starts the
        # history again, which the page states. Any other failure fails the job,
        # so a one-line manifest never shadows the real history.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=refresh-manifest" --jq '[.artifacts[]|select(.expired|not)]|length')
          if [ "$found" = "0" ]; then
            echo "::warning::no earlier refresh-manifest artifact; the change log starts here"
          else
            gh run download --repo "$GITHUB_REPOSITORY" --name refresh-manifest --dir history \
              || { sleep 10; gh run download --repo "$GITHUB_REPOSITORY" --name refresh-manifest --dir history; }
          fi
      - name: Check that Labelbox photo links are on the live host
        # Read-only, and never fails the refresh: with no key or an API error the
        # file says "not checked". The offline build below only reads the file.
        env:
          LABELBOX_API_KEY: ${{ secrets.LABELBOX_API_KEY }}
        run: python labelling/check_photo_links.py
      - name: Recompute, verify, and stage the public snapshot offline
        env:
          FETCH_LABELS: ${{ github.event_name == 'schedule' || inputs.refresh_labels }}
          # Empty on a scheduled run, which hands out nothing.
          HAND_OUT: ${{ inputs.hand_out }}
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
          # predict/embed.py downloads the photos from private Arbutus buckets.
          ARBUTUS_S3_ENDPOINT: ${{ vars.ARBUTUS_S3_ENDPOINT }}
          ARBUTUS_S3_ACCESS_KEY: ${{ secrets.ARBUTUS_S3_ACCESS_KEY }}
          ARBUTUS_S3_SECRET_KEY: ${{ secrets.ARBUTUS_S3_SECRET_KEY }}
        run: |
          python - <<'PY'
          from datetime import date
          import os, subprocess, sys
          from pathlib import Path
          command = [sys.executable, 'bin/refresh_snapshot.py', 'build', '--date', date.today().isoformat(),
                     '--hand-out', str(int(float(os.environ['HAND_OUT'] or 0)))]
          if os.environ['FETCH_LABELS'] == 'true':
              exports_dir = Path(os.environ['RUNNER_TEMP']) / 'bci-private/exports'
              exports = sorted(exports_dir.glob('*.ndjson'))
              if not exports:
                  raise SystemExit('No fresh exports were fetched; refusing to publish.')
              for path in exports:
                  command += ['--export', str(path)]
              command += ['--export-date', (exports_dir / 'export_date.txt').read_text().strip()]
          subprocess.run(command, check=True)
          PY
      - name: Keep the refresh manifest for the next run
        # A validation-only run deploys nothing, so it must not become "the last update".
        if: github.event_name == 'schedule' || inputs.deploy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refresh-manifest
          path: history/manifest.jsonl
          retention-days: 90
          overwrite: true
      - name: Encrypt the per-photo vectors even when the build fails
        # A fetch costs seconds per photo. Keeping it when a later step fails
        # means the next run resumes instead of fetching the same photos again.
        if: always()
        env:
          BCI_INPUT_BUNDLE_KEY: ${{ secrets.BCI_INPUT_BUNDLE_KEY }}
        run: |
          # Each cache file holds a private bucket path, and pull_request runs can
          # restore this repo's caches. Only the encrypted archive is cached.
          umask 077
          if [ -d data/embeddings_labelled/cache ]; then
            tar -cz -C data/embeddings_labelled cache \
              | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
                  --symmetric --output "$RUNNER_TEMP/embeddings-labelled.tar.gz.gpg" \
                  3< <(printf '%s' "$BCI_INPUT_BUNDLE_KEY")
          fi
      - name: Save the encrypted per-photo vectors
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/embeddings-labelled.tar.gz.gpg
          key: embeddings-labelled-enc-${{ github.run_id }}
      - name: Restore the thumbnails generated by earlier runs
        # Gaps in the release are filled from Arbutus below. Restoring first means
        # a gap is fetched once, not every week. The release tar then overlays it.
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: docs/thumbs/480
          key: thumbs-480-${{ github.run_id }}
          restore-keys: thumbs-480-
      - name: Add photo thumbnails from the thumbs-480 release
        # Read-only. A missing release is not an error: the pages show Photo unavailable.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/thumbs"
          mkdir -p "$dir"
          if gh release download thumbs-480 --repo "$GITHUB_REPOSITORY" --pattern thumbs-480.tar --dir "$dir"; then
            mkdir -p docs/thumbs/480
            tar -xf "$dir/thumbs-480.tar" --no-same-owner -C docs/thumbs/480
          else
            echo "::warning::release thumbs-480 not found; publishing without thumbnails"
          fi
      - name: Fill the thumbnail gaps from Arbutus
        # Only photos the built pages show and no thumbnail yet covers. The step
        # fails if any still lacks one, so the site never ships a silent gap.
        # The failure list stays out of docs/, which is published.
        env:
          ARBUTUS_S3_ENDPOINT: ${{ vars.ARBUTUS_S3_ENDPOINT }}
          ARBUTUS_S3_ACCESS_KEY: ${{ secrets.ARBUTUS_S3_ACCESS_KEY }}
          ARBUTUS_S3_SECRET_KEY: ${{ secrets.ARBUTUS_S3_SECRET_KEY }}
        run: |
          mkdir -p docs/thumbs/480
          python labelling/fetch_photo_thumbs.py --out docs/thumbs/480 --pages docs \
            --failures "$RUNNER_TEMP/thumb-failures.txt"
      - name: Keep the thumbnails even when a gap remains
        # The next run then only retries the photos that failed.
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: docs/thumbs/480
          key: thumbs-480-${{ github.run_id }}
      - name: Upload only the verified public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
          retention-days: 1
      - name: Commit the send record and the pinned batches
        # The build records batches sent by hand from the export (input/rounds/) and
        # rewrites the pin file. Both must reach main or the next run starts from the
        # old record. Only when they changed, and only on a run that deploys, so the
        # pins match the live list. A rejected push must not hold back the site: the
        # next run derives the same rows again from the export.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.deploy)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add input/rounds input/pinned_batches.csv
          if git diff --cached --quiet; then
            echo "send record and pinned batches unchanged"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(rounds): record sends and pinned batches'
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main
          fi
      - name: Remove all private baseline and export files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/bci-private" "$GITHUB_WORKSPACE/data" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/snapshots"

  deploy:
    if: github.event_name == 'schedule' || inputs.deploy
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified public snapshot
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
