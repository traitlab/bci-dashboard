name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline contracts, dashboard subprocesses hide site-packages
        run: python -m pytest -q tests/test_public_pages.py
      - name: Build both pages from synthetic observations
        run: python tests/public_snapshot.py "$RUNNER_TEMP/public-dashboard"

  public-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # labelfirst/crownfirst are separate research environments, not on PyPI.
      # Fetch and annotation tests execute here with all their public deps.
      - run: python -m pip install -r requirements-dev.txt -r requirements-predict.txt ruff mypy
      - run: python -m pytest -q
      - name: Lint all Python for syntax and undefined control-flow errors
        run: ruff check --isolated --select E9,F63,F7,F82 dashboard tests
      - name: Lint and format the public test harness
        run: |
          ruff check --isolated tests/public_snapshot.py tests/test_public_pages.py tests/test_private_selection.py tests/conftest.py tests/test_explain.py tests/test_readme.py
          ruff format --isolated --check tests/public_snapshot.py tests/test_public_pages.py tests/test_private_selection.py
      - name: Type-check the modified tests
        run: mypy --follow-imports=skip --ignore-missing-imports tests/public_snapshot.py tests/test_public_pages.py tests/test_private_selection.py tests/conftest.py tests/test_explain.py tests/test_readme.py

  private-libs:
    runs-on: ubuntu-latest
    env:
      TRAITLAB_READ_TOKEN: ${{ secrets.TRAITLAB_READ_TOKEN }}
    steps:
      # Forks and Dependabot get no secrets: skip without failing.
      - name: Skip when the private-repo token is unavailable
        if: env.TRAITLAB_READ_TOKEN == ''
        run: echo "::warning::TRAITLAB_READ_TOKEN is empty, private libs (crownfirst, labelfirst) were skipped"
      - if: env.TRAITLAB_READ_TOKEN != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # crownfirst and labelfirst both require Python 3.13.
      - if: env.TRAITLAB_READ_TOKEN != ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install public deps and the private libs
        if: env.TRAITLAB_READ_TOKEN != ''
        # crownfirst pins its own labelfirst commit, so labelfirst comes in as its dependency.
        run: |
          git config --global url."https://x-access-token:${TRAITLAB_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          python -m pip install -r requirements-dev.txt -r requirements-predict.txt
          python -m pip install "crownfirst @ git+https://github.com/traitlab/crownfirst.git"
      - name: Tests that need crownfirst and labelfirst
        if: env.TRAITLAB_READ_TOKEN != ''
        run: python -m pytest -q -rs
